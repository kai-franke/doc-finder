<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">DocFinder app icon</title>
  <desc id="description">A white document and magnifying glass on a rounded blue macOS icon.</desc>
  <defs>
